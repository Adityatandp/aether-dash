name: hardware-bom

on:
  push:
    paths:
      - "aether-hardware/**"
      - ".github/workflows/hardware-bom.yml"
  pull_request:
    paths:
      - "aether-hardware/**"
      - ".github/workflows/hardware-bom.yml"

jobs:
  bom-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint BOM CSVs
        run: |
          python aether-hardware/tools/bom_lint.py \
            aether-hardware/products/dash-s35/revA/bom/bom.csv
